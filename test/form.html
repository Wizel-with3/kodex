<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form to Telegram</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Noto Sans Myanmar", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #f5f7fa;
      color: #202124;
    }

    #contactForm {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border: 1px solid #e3e6ea;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    #contactForm div {
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-row > div {
      min-width: 0;
      margin-bottom: 0;
    }

    label {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccd2d8;
      border-radius: 8px;
      background: #ffffff;
      color: #202124;
      font: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input {
      height: 42px;
      padding: 0 12px;
      border-top: none;
    }

    textarea {
      min-height: 80px;
      padding: 10px 12px;
      resize: vertical;
    }

    input[type="file"] {
      height: auto;
      padding: 8px;
    }

    input:focus,
    textarea:focus {
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.12);
    }

    #kpayPreview {
      display: none;
      width: auto;
      max-width: 100%;
      max-height: 240px;
      margin-top: 10px;
      border: 1px solid #e3e6ea;
      border-radius: 8px;
      object-fit: contain;
    }

    #kpayCheck {
      display: none;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    #kpayCheck.valid {
      color: #16803a;
    }

    #kpayCheck.invalid {
      color: #b42318;
    }

    #submitBtn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #202124;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    #submitBtn:hover {
      background: #3c4043;
    }

    #submitBtn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      width: 100%;
      max-width: 480px;
      margin: 12px auto 0;
      text-align: center;
      font-size: 14px;
    }

    html[data-theme="dark"] body {
      background: #151719;
      color: #f0f0f0;
    }

    html[data-theme="dark"] #contactForm {
      border-color: #3b4146;
      background: #202326;
    }

    html[data-theme="dark"] input,
    html[data-theme="dark"] textarea {
      border-color: #51575d;
      background: #181a1b;
      color: #f0f0f0;
    }

    html[data-theme="dark"] #kpayPreview {
      border-color: #51575d;
    }

    html[data-theme="dark"] #submitBtn {
      background: #f0f0f0;
      color: #17191b;
    }

    html[data-theme="dark"] #submitBtn:hover {
      background: #d7dadd;
    }

    @media (max-width: 520px) {
      body {
        align-items: start;
        padding: 16px 12px;
      }

      #contactForm {
        padding: 20px 16px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <form id="contactForm">
    <div class="form-row">
      <div>
        <label for="senderName" data-i18n="senderName">Sender:</label><br>
        <input type="text" id="senderName" name="senderName" autocomplete="name" required>
      </div>
      <div>
        <label for="senderPhone" data-i18n="senderPhone">Sender phone number:</label><br>
        <input type="tel" id="senderPhone" name="senderPhone" autocomplete="tel" required>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label for="recipientName" data-i18n="recipientName">Recipient:</label><br>
        <input type="text" id="recipientName" name="recipientName" required>
      </div>
      <div>
        <label for="recipientPhone" data-i18n="recipientPhone">Recipient phone number:</label><br>
        <input type="tel" id="recipientPhone" name="recipientPhone" required>
      </div>
    </div>
    <br>
    <div>
      <label for="address" data-i18n="address">Address:</label><br>
      <textarea id="address" name="address" rows="3" required></textarea>
    </div>
    <br>
    <div>
      <label for="message" data-i18n="orderDetails">Order details / notes:</label><br>
      <textarea id="message" name="message" rows="4" required></textarea>
      <small data-i18n="cartNote">Cart items are filled in automatically. Add a note if needed.</small>
    </div>
    <br>
    <div>
      <label for="kpayReceipt" data-i18n="receipt">KPay receipt image (choose from photos):</label><br>
      <input type="file" id="kpayReceipt" name="kpayReceipt" accept="image/*" required>
      <br>
      <img id="kpayPreview" alt="KPay receipt preview" data-i18n-alt="receiptPreview">
      <p id="kpayCheck" role="status" aria-live="polite"></p>
    </div>
    <br>
    <button type="submit" id="submitBtn" data-i18n="order">Order</button>
  </form>

  <p id="status"></p>

  <script>
    const formTranslations = {
      en: {
        senderName: "Sender:",
        senderPhone: "Sender phone number:",
        recipientName: "Recipient:",
        recipientPhone: "Recipient phone number:",
        address: "Address:",
        orderDetails: "Order details / notes:",
        cartNote: "Cart items are filled in automatically. Add a note if needed.",
        receipt: "KPay receipt image (choose from photos):",
        receiptPreview: "KPay receipt preview",
        order: "Order",
        noCart: "No cart items were found. Return to the shop and add an item first.",
        cartError: "Could not read the saved cart. Return to the shop and try again.",
        cartTitle: "KODEX order:",
        quantity: "Qty:",
        sending: "Sending to admin...",
        photoCaption: "KPay payment receipt",
        success: "✅ The admin team will contact you after reviewing your order.",
        failed: "Failed: ",
        unknownError: "Unknown error",
        error: "Error: ",
        networkError: "A network error occurred.",
        photoError: "Could not send the image.",
        slipChecking: "Checking slip...",
        slipValid: "Basic checks passed. Admin must verify authenticity.",
        slipInvalidType: "Please upload a JPG or PNG image.",
        slipInvalidSize: "The image is too small or too large.",
        slipDuplicate: "This KPay slip has already been submitted.",
        slipUnreadable: "Could not read this image.",
      },
      my: {
        senderName: "ပို့သူ:",
        senderPhone: "ပို့သူဖုန်းနံပါတ်:",
        recipientName: "လက်ခံသူ:",
        recipientPhone: "လက်ခံသူဖုန်းနံပါတ်:",
        address: "လိပ်စာ:",
        orderDetails: "အော်ဒါအသေးစိတ် / မှတ်ချက်:",
        cartNote: "ဈေးခြင်းထဲရှိ ပစ္စည်းများကို အလိုအလျောက် ဖြည့်ထားပါသည်။ လိုအပ်ပါက မှတ်ချက်ထည့်ပါ။",
        receipt: "KPay ငွေလွှဲပြေစာပုံ (ဓာတ်ပုံများမှ ရွေးပါ):",
        receiptPreview: "KPay ငွေလွှဲပြေစာ အကြိုမြင်ကွင်း",
        order: "အော်ဒါတင်မည်",
        noCart: "ဈေးခြင်းထဲတွင် ပစ္စည်းမတွေ့ပါ။ ဆိုင်သို့ပြန်ပြီး ပစ္စည်းထည့်ပါ။",
        cartError: "သိမ်းထားသော ဈေးခြင်းကို ဖတ်မရပါ။ ဆိုင်သို့ပြန်ပြီး ထပ်ကြိုးစားပါ။",
        cartTitle: "KODEX အော်ဒါ:",
        quantity: "အရေအတွက်:",
        sending: "အက်ဒမင်ထံ ပို့နေသည်...",
        photoCaption: "KPay ငွေလွှဲပြေစာ",
        success: "✅ အက်ဒမင်မှ အော်ဒါကို စစ်ဆေးပြီးနောက် ဆက်သွယ်ပေးပါမည်။",
        failed: "မအောင်မြင်ပါ: ",
        unknownError: "မသိရှိသော အမှား",
        error: "အမှား: ",
        networkError: "ကွန်ရက်အမှား ဖြစ်ပွားခဲ့သည်။",
        photoError: "ပုံပို့၍ မရပါ။",
        slipChecking: "ငွေလွှဲပြေစာ စစ်ဆေးနေသည်...",
        slipValid: "အခြေခံစစ်ဆေးချက် အောင်မြင်သည်။ အမှန်တကယ်ဖြစ်ကြောင်း အက်ဒမင် အတည်ပြုရမည်။",
        slipInvalidType: "JPG သို့မဟုတ် PNG ပုံကိုသာ တင်ပါ။",
        slipInvalidSize: "ပုံအရွယ်အစား သေးလွန်းသည် သို့မဟုတ် ကြီးလွန်းသည်။",
        slipDuplicate: "ဤ KPay ငွေလွှဲပြေစာကို အရင်တင်ထားပြီးဖြစ်သည်။",
        slipUnreadable: "ဤပုံကို ဖတ်မရပါ။",
      },
    };

    function readFormPreference(key, validValues, fallback) {
      try {
        const value = localStorage.getItem(key);
        return validValues.includes(value) ? value : fallback;
      } catch (error) {
        console.warn(`Could not read preference "${key}".`, error);
        return fallback;
      }
    }

    let currentLanguage = readFormPreference("site-language", ["en", "my"], "en");

    function applyFormPreferences() {
      currentLanguage = readFormPreference("site-language", ["en", "my"], "en");
      const theme = readFormPreference("site-theme", ["light", "dark"], "light");
      document.documentElement.lang = currentLanguage;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = formTranslations[currentLanguage][element.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-alt]").forEach((element) => {
        element.alt = formTranslations[currentLanguage][element.dataset.i18nAlt];
      });
    }

    function formText(key) {
      return formTranslations[currentLanguage][key];
    }

    applyFormPreferences();

    const BOT_TOKEN = "9181923719:AAEAgO368kua9Iy4kzYHtErzXSjcdMz9lEY"; // @BotFather မှ ရသော Token
    const CHAT_ID = "8939327163"; // ဥပမာ - "-1001234567890"

    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const kpayReceiptInput = document.getElementById("kpayReceipt");
    const kpayPreview = document.getElementById("kpayPreview");
    const kpayCheck = document.getElementById("kpayCheck");
    const messageInput = document.getElementById("message");

    let autoFilledCartDetails = false;
    let validatedKpayHash = "";

    function fillCartDetails() {
      try {
        const savedCart = JSON.parse(localStorage.getItem("shoe-cart") || "[]");
        const items = Array.isArray(savedCart)
          ? savedCart.filter((entry) => Array.isArray(entry)
            && entry[1]
            && typeof entry[1].name === "string"
            && typeof entry[1].color === "string"
            && Number.isInteger(entry[1].quantity)
            && entry[1].quantity > 0)
          : [];

        if (items.length > 0) {
          messageInput.value = [
            formText("cartTitle"),
            ...items.map(([, item]) => `- ${item.name} | ${item.color} | ${formText("quantity")} ${item.quantity}`)
          ].join("\n");
          autoFilledCartDetails = true;
        } else {
          autoFilledCartDetails = false;
          statusEl.textContent = formText("noCart");
        }
      } catch (error) {
        autoFilledCartDetails = false;
        console.warn("Could not read the saved cart.", error);
        statusEl.textContent = formText("cartError");
      }
    }

    messageInput.addEventListener("input", () => {
      autoFilledCartDetails = false;
    });
    fillCartDetails();

    window.addEventListener("storage", (event) => {
      if (event.key === "site-language" || event.key === "site-theme") {
        applyFormPreferences();
        if (event.key === "site-language" && autoFilledCartDetails) {
          fillCartDetails();
        }
      }
    });

    async function getFileHash(file) {
      const buffer = await file.arrayBuffer();
      const digest = await crypto.subtle.digest("SHA-256", buffer);
      return [...new Uint8Array(digest)]
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    kpayReceiptInput.addEventListener("change", async function () {
      const file = kpayReceiptInput.files[0];
      validatedKpayHash = "";

      if (!file) {
        kpayPreview.src = "";
        kpayPreview.style.display = "none";
        kpayCheck.style.display = "none";
        return;
      }

      kpayCheck.className = "";
      kpayCheck.classList.remove("invalid", "valid");
      kpayCheck.textContent = formText("slipChecking");
      kpayCheck.style.display = "block";

      if (!["image/jpeg", "image/png"].includes(file.type)) {
        kpayCheck.classList.add("invalid");
        kpayCheck.textContent = formText("slipInvalidType");
        kpayReceiptInput.setCustomValidity(formText("slipInvalidType"));
        return;
      }

      if (file.size < 50000 || file.size > 10000000) {
        kpayCheck.classList.add("invalid");
        kpayCheck.textContent = formText("slipInvalidSize");
        kpayReceiptInput.setCustomValidity(formText("slipInvalidSize"));
        return;
      }

      try {
        const previewUrl = URL.createObjectURL(file);
        kpayPreview.src = previewUrl;
        kpayPreview.style.display = "block";

        await new Promise((resolve, reject) => {
          kpayPreview.onload = resolve;
          kpayPreview.onerror = reject;
        });

        if (kpayPreview.naturalWidth < 500 || kpayPreview.naturalHeight < 500) {
          kpayCheck.classList.add("invalid");
          kpayCheck.textContent = formText("slipInvalidSize");
          kpayReceiptInput.setCustomValidity(formText("slipInvalidSize"));
          return;
        }

        validatedKpayHash = await getFileHash(file);
        let submittedHashes = [];
        try {
          submittedHashes = JSON.parse(localStorage.getItem("kpay-submitted-hashes") || "[]");
        } catch {
          submittedHashes = [];
        }

        if (submittedHashes.includes(validatedKpayHash)) {
          kpayCheck.classList.add("invalid");
          kpayCheck.textContent = formText("slipDuplicate");
          kpayReceiptInput.setCustomValidity(formText("slipDuplicate"));
          return;
        }

        kpayReceiptInput.setCustomValidity("");
        kpayCheck.classList.add("valid");
        kpayCheck.textContent = formText("slipValid");
      } catch {
        kpayCheck.classList.add("invalid");
        kpayCheck.textContent = formText("slipUnreadable");
        kpayReceiptInput.setCustomValidity(formText("slipUnreadable"));
      }
    });

    kpayPreview.addEventListener("load", function () {
      if (kpayPreview.src.startsWith("blob:")) {
        URL.revokeObjectURL(kpayPreview.src);
      }
    });

    form.addEventListener("reset", function () {
      kpayPreview.src = "";
      kpayPreview.style.display = "none";
      kpayCheck.style.display = "none";
      kpayCheck.className = "";
      kpayReceiptInput.setCustomValidity("");
      validatedKpayHash = "";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const senderName = document.getElementById("senderName").value.trim();
      const recipientName = document.getElementById("recipientName").value.trim();
      const senderPhone = document.getElementById("senderPhone").value.trim();
      const recipientPhone = document.getElementById("recipientPhone").value.trim();
      const address = document.getElementById("address").value.trim();
      const message = document.getElementById("message").value.trim();
      const kpayReceipt = document.getElementById("kpayReceipt").files[0];
      const text =
        " Sender: " + senderName + "\n" +
        " Sender phone: " + senderPhone + "\n" +
        " Recipient: " + recipientName + "\n" +
        " Recipient phone: " + recipientPhone + "\n" +
        " Address: " + address + "\n" +
        " Message: " + message + "\n" +
        " KPay slip verification: Basic checks passed; manual admin verification required.";

      submitBtn.disabled = true;
      statusEl.textContent = formText("sending");

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text
          })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          const photoUploads = [
            { file: kpayReceipt, caption: formText("photoCaption") }
          ];

          for (const photo of photoUploads) {
            const photoData = new FormData();
            photoData.append("chat_id", CHAT_ID);
            photoData.append("caption", photo.caption);
            photoData.append("photo", photo.file);

            const photoResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
              method: "POST",
              body: photoData
            });

            const photoResult = await photoResponse.json();
            if (!photoResponse.ok || !photoResult.ok) {
              throw new Error(photoResult.description || formText("photoError"));
            }
          }

          if (validatedKpayHash) {
            let submittedHashes = [];
            try {
              submittedHashes = JSON.parse(localStorage.getItem("kpay-submitted-hashes") || "[]");
            } catch {
              submittedHashes = [];
            }
            if (!submittedHashes.includes(validatedKpayHash)) {
              submittedHashes.unshift(validatedKpayHash);
              localStorage.setItem("kpay-submitted-hashes", JSON.stringify(submittedHashes.slice(0, 200)));
            }
          }

          statusEl.textContent = formText("success");

          let orderItems = [];
          try {
            const savedCart = JSON.parse(localStorage.getItem("shoe-cart") || "[]");
            orderItems = Array.isArray(savedCart)
              ? savedCart
                  .filter((entry) => Array.isArray(entry) && entry[1])
                  .map(([key, item]) => ({
                    key,
                    name: item.name,
                    color: item.color,
                    quantity: item.quantity
                  }))
              : [];
          } catch (error) {
            console.warn("Could not read cart for order history.", error);
          }

          window.parent.postMessage({
            type: "KODEX_ORDER_SUCCESS",
            order: {
              id: `KDX-${Date.now().toString().slice(-8)}`,
              createdAt: new Date().toISOString(),
              senderName,
              senderPhone,
              recipientName,
              recipientPhone,
              address,
              message,
              items: orderItems
            }
          }, "*");

          form.reset();
        } else {
          statusEl.textContent = formText("failed") + (data.description || formText("unknownError"));
        }
      } catch (error) {
        statusEl.textContent = formText("error") + (error.message || formText("networkError"));
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
