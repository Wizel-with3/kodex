<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form to Telegram</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Noto Sans Myanmar", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #f5f7fa;
      color: #202124;
    }

    #contactForm {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border: 1px solid #e3e6ea;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    #contactForm div {
      margin-bottom: 16px;
    }

    label {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccd2d8;
      border-radius: 8px;
      background: #ffffff;
      color: #202124;
      font: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 80px;
      padding: 10px 12px;
      resize: vertical;
    }

    input[type="file"] {
      height: auto;
      padding: 8px;
    }

    input:focus,
    textarea:focus {
      border-color: #2d6cdf;
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.12);
    }

    #kpayPreview {
      display: none;
      width: auto;
      max-width: 100%;
      max-height: 240px;
      margin-top: 10px;
      border: 1px solid #e3e6ea;
      border-radius: 8px;
      object-fit: contain;
    }

    #submitBtn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #202124;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: background 0.2s, opacity 0.2s;
    }

    #submitBtn:hover {
      background: #3c4043;
    }

    #submitBtn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      width: 100%;
      max-width: 480px;
      margin: 12px auto 0;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      body {
        align-items: start;
        padding: 16px 12px;
      }

      #contactForm {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <form id="contactForm">
    <div>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required>
    </div>
    <br>
    <div>
      <label for="phone">Phone No.:</label><br>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <br>
    <div>
      <label for="address">Address:</label><br>
      <textarea id="address" name="address" rows="3" required></textarea>
    </div>
    <br>
    <div>
      <label for="message">Order details / notes:</label><br>
      <textarea id="message" name="message" rows="4" required></textarea>
      <small>Cart items are filled in automatically. Add a note if needed.</small>
    </div>
    <br>
    <div>
      <label for="kpayReceipt">Kpay Slips:</label><br>
      <input type="file" id="kpayReceipt" name="kpayReceipt" accept="image/*" capture="environment" required>
      <br>
      <img id="kpayPreview" alt="KPay ငွေလွှဲပြေစာအကြိုမြင်ကွင်း">
    </div>
    <br>
    <button type="submit" id="submitBtn">Order</button>
  </form>

  <p id="status"></p>

  <script>
    const BOT_TOKEN = "9181923719:AAEAgO368kua9Iy4kzYHtErzXSjcdMz9lEY"; // @BotFather မှ ရသော Token
    const CHAT_ID = "8939327163"; // ဥပမာ - "-1001234567890"

    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const kpayReceiptInput = document.getElementById("kpayReceipt");
    const kpayPreview = document.getElementById("kpayPreview");
    const messageInput = document.getElementById("message");

    try {
      const savedCart = JSON.parse(localStorage.getItem("shoe-cart") || "[]");
      const items = Array.isArray(savedCart)
        ? savedCart.filter((entry) => Array.isArray(entry)
          && entry[1]
          && typeof entry[1].name === "string"
          && typeof entry[1].color === "string"
          && Number.isInteger(entry[1].quantity)
          && entry[1].quantity > 0)
        : [];

      if (items.length > 0) {
        messageInput.value = [
          "KODEX order:",
          ...items.map(([, item]) => `- ${item.name} | ${item.color} | Qty: ${item.quantity}`)
        ].join("\n");
      } else {
        statusEl.textContent = "No cart items were found. Return to the shop and add an item first.";
      }
    } catch {
      statusEl.textContent = "Could not read the saved cart. Return to the shop and try again.";
    }

    kpayReceiptInput.addEventListener("change", function () {
      const file = kpayReceiptInput.files[0];

      if (!file) {
        kpayPreview.src = "";
        kpayPreview.style.display = "none";
        return;
      }

      kpayPreview.src = URL.createObjectURL(file);
      kpayPreview.style.display = "block";
    });

    kpayPreview.addEventListener("load", function () {
      if (kpayPreview.src.startsWith("blob:")) {
        URL.revokeObjectURL(kpayPreview.src);
      }
    });

    form.addEventListener("reset", function () {
      kpayPreview.src = "";
      kpayPreview.style.display = "none";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const message = document.getElementById("message").value.trim();
      const kpayReceipt = document.getElementById("kpayReceipt").files[0];
      const text =
        "📩 New Form Submission\n\n" +
        "👤 Name: " + name + "\n" +
        "📞 Phone: " + phone + "\n" +
        "🏠 Address: " + address + "\n" +
        "💬 Message: " + message;

      submitBtn.disabled = true;
      statusEl.textContent = "ပို့နေပါသည်...";

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text
          })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          const photoUploads = [
            { file: kpayReceipt, caption: "🧾 KPay ငွေလွှဲပြေစာ" }
          ];

          for (const photo of photoUploads) {
            const photoData = new FormData();
            photoData.append("chat_id", CHAT_ID);
            photoData.append("caption", photo.caption);
            photoData.append("photo", photo.file);

            const photoResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
              method: "POST",
              body: photoData
            });

            const photoResult = await photoResponse.json();
            if (!photoResponse.ok || !photoResult.ok) {
              throw new Error(photoResult.description || "ပုံပို့၍မရပါ");
            }
          }

          statusEl.textContent = "✅ Telegram ထဲသို့ ပို့ပြီးပါပြီ။";
          form.reset();
        } else {
          statusEl.textContent = "❌ မအောင်မြင်ပါ: " + (data.description || "Unknown error");
        }
      } catch (error) {
        statusEl.textContent = "❌ " + (error.message || "Network error ဖြစ်နေပါသည်။");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
